# TODO(guru -> kikimimi rename): the Fly app itself is still named "guru-cloud"
# (renaming/migrating the live Fly app is being handled separately from the
# source-level rename -- see README/report). The binary it runs is now
# kikimimi-cloud (Dockerfile CMD).
app = "guru-cloud"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
