name: Desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/**'
      - 'package*.json'
      - 'desktop/**'
      - 'crates/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  macos-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install build-time query engine and certificate test tooling
        run: |
          brew install duckdb openssl@3
          echo "OPENSSL_BIN=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Install desktop tooling
        working-directory: .
        run: npm ci
      - name: Validate desktop scripts
        working-directory: desktop
        run: npm run check
      - name: Test update UI (mock native bridge)
        working-directory: desktop
        run: npm run build:ui && npm run test:ui
      - name: Test embedded Cloud presentation and loading
        working-directory: desktop
        run: npm run test:cloud-readiness
      - name: Build development preview (not for public distribution)
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run build -- --bundles app
      - name: Test standalone history viewer (collection stays off)
        working-directory: desktop
        env:
          KIKIMIMI_BINARY: ${{ github.workspace }}/desktop/src-tauri/target/release/bundle/macos/kikimimi.app/Contents/MacOS/kikimimi
        run: npm run test:viewer
      - name: Test collection, application attribution and Cowork replay through the browser
        working-directory: desktop
        env:
          KIKIMIMI_BINARY: ${{ github.workspace }}/desktop/src-tauri/target/release/bundle/macos/kikimimi.app/Contents/MacOS/kikimimi
        run: npm run test:collection
      - name: Preserve app permissions and bundle structure
        run: ditto -c -k --sequesterRsrc --keepParent desktop/src-tauri/target/release/bundle/macos/kikimimi.app desktop/kikimimi-macos-preview.zip
      - uses: actions/upload-artifact@v7
        with:
          name: kikimimi-macos-development-preview
          path: desktop/kikimimi-macos-preview.zip
