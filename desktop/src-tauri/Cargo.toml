[package]
name = "kikimimi-desktop"
version = "0.7.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tempfile = "3"
flate2 = "1"
tar = "0.4"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "io-util"] }

reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[workspace]
