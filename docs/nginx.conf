server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Kikimimi-Site static always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Kikimimi-Site static always;
        try_files /kikimimi/index.html =404;
    }
    location = /kikimimi { return 308 /; }
    location = /kikimimi/ { return 308 /; }
    location /kikimimi/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Kikimimi-Site static always;
        try_files $uri $uri/ =404;
    }
    # Never serve a dashboard or API request as website HTML.
    location / { return 404; }
}
