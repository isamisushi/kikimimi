name: Desktop signed release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish immutable release and advance the desktop update channel'
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      KIKIMIMI_UPDATER_PUBLIC_KEY: ${{ vars.KIKIMIMI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install certificate tooling
        run: |
          brew install openssl@3
          echo "OPENSSL_BIN=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Derive Apple signing identity and Team ID from P12
        run: node desktop/scripts/apple-identity.mjs
      - name: Require release credentials and matching versions
        run: node desktop/scripts/check-release.mjs
      - name: Generate updater bundler configuration with the release public key
        run: node desktop/scripts/release-config.mjs
      - run: brew install minisign
      - name: Install pinned standalone DuckDB for this architecture
        shell: bash
        run: |
          case '${{ matrix.arch }}' in
            aarch64)
              duckdb_arch=arm64
              duckdb_sha=188a36fe8883ef52e69165a0cbb6031ef679c8e6c448a1ce22951964149b7f96
              ;;
            x86_64)
              duckdb_arch=amd64
              duckdb_sha=fbc7013ba09d117396dabf16783281c2add47fc01cdac4855464a03526dc96ee
              ;;
          esac
          duckdb_dir="$RUNNER_TEMP/duckdb-2.0.0"
          mkdir -p "$duckdb_dir"
          curl --fail --location --retry 3 "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-osx-${duckdb_arch}.tar.gz" -o "$duckdb_dir/duckdb.tar.gz"
          echo "$duckdb_sha  $duckdb_dir/duckdb.tar.gz" | shasum -a 256 -c -
          tar -xzf "$duckdb_dir/duckdb.tar.gz" -C "$duckdb_dir"
          chmod +x "$duckdb_dir/duckdb"
          "$duckdb_dir/duckdb" --version
          echo "DUCKDB_BINARY=$duckdb_dir/duckdb" >> "$GITHUB_ENV"
          echo "$duckdb_dir" >> "$GITHUB_PATH"
      - working-directory: .
        run: npm ci
      - working-directory: desktop
        run: npm run check
      - working-directory: desktop
        run: npm run test:signing
      - name: Test desktop UI
        working-directory: desktop
        run: npm run build:ui && npm run test:ui
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          projectPath: desktop
          args: --bundles app,dmg --config src-tauri/tauri.release.generated.conf.json
      - name: Launch the packaged public app and reject startup crashes
        run: /usr/bin/python3 desktop/scripts/startup_check.py desktop/src-tauri/target/release/bundle/macos/kikimimi.app
      - name: Retain signed build for diagnosing validation failures
        uses: actions/upload-artifact@v7
        with:
          name: desktop-built-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Verify collection and application attribution with the bundled collector
        working-directory: desktop
        env:
          KIKIMIMI_BINARY: ${{ github.workspace }}/desktop/src-tauri/target/release/bundle/macos/kikimimi.app/Contents/MacOS/kikimimi
        run: npm run test:collection
      - name: Verify signed and notarized app
        run: |
          codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/kikimimi.app
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" = 3 ]; then return 1; fi
              sleep 5
            done
          }
          retry xcrun stapler validate desktop/src-tauri/target/release/bundle/macos/kikimimi.app
          retry spctl --assess --type execute desktop/src-tauri/target/release/bundle/macos/kikimimi.app
      - name: Stage immutable update artifacts
        run: node desktop/scripts/release.mjs stage desktop/src-tauri/target/release/bundle desktop/release-artifacts '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-signed-${{ matrix.arch }}
          path: desktop/release-artifacts/

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-signed-*
          path: desktop/release-artifacts
          merge-multiple: true
      - name: Create complete update manifest
        run: node desktop/scripts/release.mjs manifest desktop/release-artifacts desktop/latest.json
      - name: Publish binaries before advancing the channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node desktop/scripts/publish-release.mjs
