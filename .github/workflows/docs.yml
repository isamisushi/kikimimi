name: Deploy static website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-static-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Build and deploy static website
        working-directory: docs
        run: flyctl deploy --remote-only --ha=false --no-public-ips
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SITE_DEPLOY_TOKEN }}
