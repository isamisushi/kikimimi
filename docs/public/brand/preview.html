<!doctype html>
<html lang="ja">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kikimimi — ロゴ案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px; background: #eeefeb; color: #191b1d; font-family: system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #616562; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin: 32px 0; }
    .panel { display: grid; place-items: center; min-height: 360px; padding: 32px; border-radius: 24px; background: #fff; }
    .dark { background: #191b1d; color: #fff; }
    .hero { width: min(100%, 300px); }
    .lockup { display: flex; align-items: center; gap: 20px; }
    .lockup img { width: 72px; }
    .lockup span { font-size: clamp(26px, 4vw, 40px); font-weight: 650; letter-spacing: -.04em; }
    .sizes { display: flex; align-items: end; flex-wrap: wrap; gap: 32px; padding: 32px; background: #fff; border-radius: 24px; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 12px; color: #616562; font-size: 12px; }
    a { color: inherit; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .panel { min-height: 280px; } }
  </style>
  <main>
    <h1>kikimimi ロゴ案</h1>
    <p>耳の輪郭と文字が重なる、元画像の形を活かしたベクターロゴ。</p>
    <div class="grid">
      <div class="panel dark"><img class="hero" src="kikimimi-mark-white.svg" alt="白の kikimimi ロゴ"></div>
      <div class="panel"><img class="hero" src="kikimimi-mark.svg" alt="黒の kikimimi ロゴ"></div>
      <div class="panel"><div class="lockup"><img src="kikimimi-mark.svg" alt=""><span>kikimimi</span></div></div>
      <div class="panel dark"><div class="lockup"><img src="kikimimi-mark-white.svg" alt=""><span>kikimimi</span></div></div>
    </div>
    <div class="sizes" aria-label="サイズ比較">
      <figure><img src="kikimimi-mark.svg" width="128" height="128" alt=""><figcaption>128 px</figcaption></figure>
      <figure><img src="kikimimi-mark.svg" width="64" height="64" alt=""><figcaption>64 px</figcaption></figure>
      <figure><img src="kikimimi-mark.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
      <figure><img src="kikimimi-mark.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
    </div>
    <p>ダウンロード：<a href="kikimimi-mark.svg" download>黒・背景透過 SVG</a> ／ <a href="kikimimi-mark-white.svg" download>白・背景透過 SVG</a></p>
  </main>
</html>
