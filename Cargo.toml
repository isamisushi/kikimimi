[workspace]
resolver = "2"
members = [
  "crates/schema",
  "crates/spool",
  "crates/adapter-claude",
  "crates/otlp",
  "crates/sink",
  "crates/cli",
  "crates/cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
kikimimi-schema = { path = "crates/schema" }
kikimimi-spool = { path = "crates/spool" }
kikimimi-adapter-claude = { path = "crates/adapter-claude" }
kikimimi-otlp = { path = "crates/otlp" }
kikimimi-sink = { path = "crates/sink" }
kikimimi-cloud = { path = "crates/cloud" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
