[package]
name = "kikimimi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/isamisushi/kikimimi"
description = "Observability for AI coding agents - see what your agents actually do, locally first"
homepage = "https://github.com/isamisushi/kikimimi"

[lib]
name = "kikimimi_cli"
path = "src/lib.rs"

# Three bin targets sharing one `run()` (src/lib.rs): "kikimimi" is the
# primary name, "kkmm" ship as short aliases (README).
[[bin]]
name = "kikimimi"
path = "src/bin/kikimimi.rs"

[[bin]]
name = "kkmm"
path = "src/bin/kkmm.rs"

[dependencies]
kikimimi-schema.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
kikimimi-spool.workspace = true
kikimimi-adapter-claude.workspace = true
kikimimi-adapter-codex.workspace = true
kikimimi-otlp.workspace = true
kikimimi-sink.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
chrono.workspace = true
libc = "0.2.189"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
parquet = { version = "59.2.0", default-features = false, features = ["zstd", "arrow"] }
# architecture.md §8 (個人ビュー/ローカル): the local `kikimimi agent` web UI.
axum = "0.8.9"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rand = "0.10.2"
hex.workspace = true
# `kikimimi self-update`: axodotdev's own updater library, same vendor as cargo-dist itself
# (dist-workspace.toml), so it reads the exact install receipt `kikimimi-installer.sh` (the
# shell installer cargo-dist generates) writes. Mirrors katamari's (a sibling project's) own
# `self-update` command choice of dependency and feature set verbatim: `default-features =
# false` because the only thing this crate needs past its own defaults is deliberate about
# the two features we do want: `blocking` for a sync call (`self_update_cmd.rs` -- kikimimi's
# CLI, like katamari's, has no reason to run inside a tokio runtime for a one-shot command)
# instead of hand-rolling one, and `github_releases` (on by default upstream) since GitHub is
# the only release host this crate ships to.
axoupdater = { version = "0.10.2", default-features = false, features = ["blocking", "github_releases"] }

[dev-dependencies]
httpmock = "0.8.3"
serial_test = "4.0.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
